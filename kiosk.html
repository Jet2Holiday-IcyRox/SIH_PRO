<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>रोगी सहायता केंद्र · Patient Intake Kiosk</title>
<style>
  /* Kiosk styling is deliberately oversized: the target user is elderly, may be
     standing, and has never used a touchscreen. Nothing is below 20px, every
     control is at least 64px tall, and contrast stays above 7:1 throughout. */
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #10243a;
    --muted: #5b6b7d;
    --line: #d8e0e8;
    --accent: #0b6b4f;
    --accent-ink: #ffffff;
    --critical: #b3261e;
    --critical-bg: #fdecea;
    --focus: #0b6b4f;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 20px/1.5 "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .brand small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
  .spacer { flex: 1 1 auto; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 16px; color: var(--muted); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { flex: 1 1 auto; overflow-y: auto; padding: 24px 20px 140px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
  h1 { font-size: 34px; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 19px; margin: 0 0 26px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    min-height: 84px; padding: 16px 18px; font-size: 21px; font-family: inherit; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); cursor: pointer;
    transition: border-color .12s, background .12s, transform .06s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.985); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: #eaf5f0; }
  .opt .ico { font-size: 34px; line-height: 1; flex: none; }
  .opt .txt { display: flex; flex-direction: column; }
  .opt .txt small { color: var(--muted); font-size: 15px; }
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .scale button {
    min-height: 74px; font-size: 22px; font-weight: 600; font-family: inherit;
    border: 2px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; color: var(--ink);
  }
  .scale button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 16px; margin-top: 8px; }
  textarea {
    width: 100%; min-height: 150px; padding: 16px; font: inherit; color: var(--ink);
    border: 2px solid var(--line); border-radius: var(--radius); background: #fff; resize: vertical;
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); padding: 14px 20px;
    display: flex; gap: 12px; align-items: center; justify-content: center;
  }
  .btn {
    min-height: 68px; padding: 0 30px; font: 600 21px/1 inherit; font-family: inherit;
    border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.mic { background: #fff; }
  .btn.mic.listening { background: var(--critical); color: #fff; border-color: var(--critical); animation: pulse 1.1s infinite; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .72 } }
  .heard { text-align: center; color: var(--muted); font-size: 17px; min-height: 24px; margin-top: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 22px; }
  ul.plain { margin: 0; padding-left: 22px; color: var(--muted); font-size: 18px; }
  ul.plain li { margin-bottom: 8px; }
  .alert { position: fixed; inset: 0; background: var(--critical-bg); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .alert .inner { max-width: 620px; text-align: center; }
  .alert .big { font-size: 78px; }
  .alert h2 { color: var(--critical); font-size: 34px; margin: 14px 0; }
  .alert p { font-size: 22px; line-height: 1.5; }
  .docrow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
  .docrow:last-child { border-bottom: 0; }
  .tag { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: #eaf5f0; color: var(--accent); font-weight: 600; }
  .tag.warn { background: #fdecea; color: var(--critical); }
  :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .hide { display: none !important; }
  @media (max-width: 640px) {
    h1 { font-size: 27px; }
    .scale { grid-template-columns: repeat(5, 1fr); }
    main { padding-bottom: 170px; }
    footer { flex-wrap: wrap; }
    .btn { flex: 1 1 auto; justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">रोगी सहायता केंद्र<small>Clinical Intake Kiosk · AYUSH OPD</small></div>
  <div class="spacer"></div>
  <button class="chip" id="lang-hi" aria-pressed="true" onclick="setLang('hi')">हिन्दी</button>
  <button class="chip" id="lang-en" aria-pressed="false" onclick="setLang('en')">English</button>
  <button class="chip" id="audio-toggle" aria-pressed="true" onclick="toggleAudio()">🔊 आवाज़</button>
</header>

<main>
  <div class="wrap">
    <div class="progress"><i id="bar"></i></div>
    <div id="screen"></div>
  </div>
</main>

<footer id="controls"></footer>

<div class="alert hide" id="alert" role="alertdialog" aria-live="assertive">
  <div class="inner">
    <div class="big">🚨</div>
    <h2 id="alert-title"></h2>
    <p id="alert-body"></p>
    <p id="alert-action" style="font-weight:600"></p>
    <button class="btn primary" onclick="dismissAlert()" id="alert-btn"></button>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Kiosk client.

   Two rules shape this file:
   1. Every question must be answerable by tapping. Voice is an accelerator that
      can fail (no mic, denied permission, unsupported browser, noisy room) and
      the interview must be completable without it.
   2. Nothing clinical is decided here. The server owns the question graph, the
      red-flag rules and the coding; this file renders what it is told and posts
      back what the patient chose.
--------------------------------------------------------------------------- */

const state = {
  lang: 'hi',
  audio: true,
  sessionId: null,
  question: null,
  selection: [],
  config: null,
  documents: [],
  ayushMode: true,
  finalizing: false,
  abhaInput: '',
  abhaResolved: null,
  abhaError: null
};

const T = {
  hi: {
    welcome: 'नमस्ते', start: 'शुरू करें', next: 'आगे', skip: 'छोड़ें', back: 'पीछे',
    speak: '🎤 बोलिए', listening: '🎤 सुन रहे हैं…', consentTitle: 'आपकी अनुमति',
    identify: 'आप कौन हैं?', newPatient: 'पहली बार आए हैं', haveAbha: 'मेरे पास ABHA है',
    scanTitle: 'पुराने पर्चे और रिपोर्ट', scanAdd: '📷 रिपोर्ट जोड़ें', scanSkip: 'कोई रिपोर्ट नहीं है',
    doneTitle: 'हो गया!', finish: 'जमा करें', heardNothing: 'सुनाई नहीं दिया, फिर बोलिए या दबाइए',
    tapOrSpeak: 'दबाइए या बोलिए', processing: 'तैयार हो रहा है…'
  },
  en: {
    welcome: 'Welcome', start: 'Start', next: 'Next', skip: 'Skip', back: 'Back',
    speak: '🎤 Speak', listening: '🎤 Listening…', consentTitle: 'Your consent',
    identify: 'Who are you?', newPatient: 'First visit', haveAbha: 'I have an ABHA ID',
    scanTitle: 'Previous prescriptions and reports', scanAdd: '📷 Add a report', scanSkip: 'I have no reports',
    doneTitle: 'All done!', finish: 'Submit', heardNothing: "Didn't catch that — please speak again or tap",
    tapOrSpeak: 'Tap an option, or speak your answer', processing: 'Preparing…'
  }
};
const t = (k) => (T[state.lang] || T.en)[k];
const L = (obj) => !obj ? '' : (obj[state.lang] || obj.en || '');

const $ = (id) => document.getElementById(id);
const screen = () => $('screen');
const controls = () => $('controls');

async function api(path, method, body) {
  const res = await fetch(path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ---------- speech ------------------------------------------------------- */

function speak(text) {
  if (!state.audio || !text || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = state.lang === 'hi' ? 'hi-IN' : 'en-IN';
    utter.rate = 0.92;
    window.speechSynthesis.speak(utter);
  } catch (err) { /* audio is an enhancement; never block on it */ }
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recogniser = null;

/**
 * Listens for one utterance and matches it against the current question's options.
 * A miss is not an error — it prompts the patient to try again or tap, which is
 * why every screen keeps its buttons visible while the mic is open.
 */
function listen() {
  if (!SpeechRec) { setHeard(state.lang === 'hi' ? 'इस ब्राउज़र में माइक उपलब्ध नहीं' : 'Microphone not available in this browser'); return; }
  const btn = $('mic');
  if (recogniser) { recogniser.stop(); return; }

  recogniser = new SpeechRec();
  recogniser.lang = state.lang === 'hi' ? 'hi-IN' : 'en-IN';
  recogniser.interimResults = false;
  recogniser.maxAlternatives = 3;

  if (btn) { btn.classList.add('listening'); btn.textContent = t('listening'); }
  window.speechSynthesis && window.speechSynthesis.cancel();

  recogniser.onresult = (event) => {
    const heard = [];
    for (let i = 0; i < event.results[0].length; i++) heard.push(event.results[0][i].transcript);
    setHeard('“' + heard[0] + '”');
    matchSpeech(heard);
  };
  recogniser.onerror = () => setHeard(t('heardNothing'));
  recogniser.onend = () => {
    recogniser = null;
    if (btn) { btn.classList.remove('listening'); btn.textContent = t('speak'); }
  };
  try { recogniser.start(); } catch (err) { recogniser = null; }
}

function setHeard(text) { const el = $('heard'); if (el) el.textContent = text || ''; }

/** Matches a spoken phrase to one of the rendered options, in either language. */
function matchSpeech(alternatives) {
  const q = state.question;
  if (!q) return;

  if (q.type === 'text') {
    const box = $('freetext');
    if (box) { box.value = alternatives[0]; }
    return;
  }
  if (q.type === 'scale') {
    for (const phrase of alternatives) {
      const digits = phrase.match(/\d+/);
      if (digits) {
        const n = Number(digits[0]);
        if (n >= 1 && n <= 10) { choose(n); return; }
      }
    }
    return;
  }

  const spoken = alternatives.map((a) => a.toLowerCase().trim());
  let best = null;
  for (const option of (q.options || [])) {
    const labels = [option.label.hi || '', option.label.en || ''].map((s) => s.toLowerCase());
    for (const phrase of spoken) {
      for (const label of labels) {
        if (!label) continue;
        // Accept a full phrase match, or a distinctive word from the label.
        const hit = phrase.includes(label) || label.includes(phrase) ||
          label.split(/\s+/).some((w) => w.length > 3 && phrase.includes(w));
        if (hit) { best = option; break; }
      }
      if (best) break;
    }
    if (best) break;
  }
  if (best) choose(best.value);
  else setHeard(t('heardNothing'));
}

/* ---------- chrome ------------------------------------------------------- */

function setLang(lang) {
  state.lang = lang;
  $('lang-hi').setAttribute('aria-pressed', String(lang === 'hi'));
  $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
  document.documentElement.lang = lang;
  render();
}

function toggleAudio() {
  state.audio = !state.audio;
  const btn = $('audio-toggle');
  btn.setAttribute('aria-pressed', String(state.audio));
  btn.textContent = state.audio ? '🔊 ' + (state.lang === 'hi' ? 'आवाज़' : 'Audio') : '🔇';
  if (!state.audio && window.speechSynthesis) window.speechSynthesis.cancel();
}

function setProgress(fraction) { $('bar').style.width = Math.round(fraction * 100) + '%'; }

function renderControls(buttons) {
  controls().innerHTML = '';
  for (const button of buttons) {
    if (!button) continue;
    const el = document.createElement('button');
    el.className = 'btn ' + (button.cls || '');
    el.textContent = button.label;
    el.id = button.id || '';
    el.disabled = Boolean(button.disabled);
    el.onclick = button.onClick;
    controls().appendChild(el);
  }
}

/* ---------- screens ------------------------------------------------------ */

let stage = 'welcome';

function render() {
  if (stage === 'welcome') return renderWelcome();
  if (stage === 'identify') return renderIdentify();
  if (stage === 'consent') return renderConsent();
  if (stage === 'question') return renderQuestion();
  if (stage === 'documents') return renderDocuments();
  if (stage === 'done') return renderDone();
}

function renderWelcome() {
  setProgress(0);
  const meta = state.config && state.config.terminology;
  screen().innerHTML = `
    <h1>${t('welcome')} 🙏</h1>
    <p class="sub">${state.lang === 'hi'
      ? 'डॉक्टर से मिलने से पहले कुछ सवाल। आप बोलकर या दबाकर जवाब दे सकते हैं।'
      : 'A few questions before you see the doctor. Answer by speaking or tapping.'}</p>
    <div class="grid">
      <button class="opt" onclick="startSession(true)">
        <span class="ico">🪷</span>
        <span class="txt"><strong>${state.lang === 'hi' ? 'आयुर्वेद ओपीडी' : 'AYUSH OPD'}</strong>
        <small>${state.lang === 'hi' ? 'दशविध परीक्षा सहित' : 'Includes Dashavidha Pariksha'}</small></span>
      </button>
      <button class="opt" onclick="startSession(false)">
        <span class="ico">🏥</span>
        <span class="txt"><strong>${state.lang === 'hi' ? 'सामान्य ओपीडी' : 'General OPD'}</strong>
        <small>${state.lang === 'hi' ? 'सामान्य जाँच' : 'Standard history'}</small></span>
      </button>
    </div>
    ${meta ? `<p class="sub" style="margin-top:26px;font-size:16px">
      ${meta.totalConcepts.toLocaleString('en-IN')} NAMASTE concepts loaded ·
      ${meta.officiallyMapped} officially mapped to ICD-11 TM2 ·
      ${meta.icd11Release}</p>` : ''}`;
  renderControls([]);
  speak(state.lang === 'hi' ? 'नमस्ते। कृपया अपना विभाग चुनिए।' : 'Welcome. Please choose your department.');
}

function startSession(ayushMode) {
  state.ayushMode = ayushMode;
  stage = 'identify';
  render();
}

/**
 * Creates the session. `abha` is whatever the patient presented, or null for a
 * walk-in — the interview is identical either way, and staff can attach an ABHA
 * later from the worklist.
 */
async function createSession(abhaValue) {
  const session = await api('/api/intake/session', 'POST', {
    language: state.lang,
    ayushMode: state.ayushMode,
    abha: abhaValue || null,
    patient: { name: 'Walk-in patient', abhaId: null }
  });
  state.sessionId = session.sessionId;
  stage = 'consent';
  render();
}

function renderIdentify() {
  setProgress(0.02);
  const resolved = state.abhaResolved;

  // Step two: the directory answered, so show the patient what it found and let
  // them confirm. A masked name is enough to recognise yourself and not enough to
  // leak an identity to whoever is next in the queue.
  if (resolved) {
    const demographics = resolved.demographics;
    screen().innerHTML = `
      <h1>${t('abhaIsThis')}</h1>
      <div class="card">
        <div style="font-size:26px;font-weight:700">${demographics && demographics.nameMasked ? demographics.nameMasked : resolved.display}</div>
        <p class="sub" style="margin:6px 0 0">${resolved.masked || resolved.display}
          ${demographics && demographics.yearOfBirth ? ' · ' + demographics.yearOfBirth : ''}
          ${demographics && demographics.gender ? ' · ' + demographics.gender : ''}</p>
        ${!resolved.knownToDirectory
          ? `<p class="sub" style="color:#b45309;margin-top:10px">${t('abhaNotFound')}</p>` : ''}
      </div>`;
    renderControls([
      { label: t('no'), onClick: () => { state.abhaResolved = null; state.abhaInput = ''; render(); } },
      { label: t('yes'), cls: 'primary', onClick: () => createSession(resolved.display) }
    ]);
    speak(t('abhaIsThis'));
    return;
  }

  // Step one: ask whether they have an ABHA at all.
  screen().innerHTML = `
    <h1>${t('abhaTitle')}</h1>
    <p class="sub">${t('abhaHint')}</p>
    <input id="abhainput" inputmode="email" autocapitalize="none" autocomplete="off"
      value="${state.abhaInput.replace(/"/g, '&quot;')}"
      placeholder="rukmini@sbx"
      style="width:100%;min-height:78px;padding:16px 18px;font:inherit;font-size:24px;
             border:2px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink)">
    ${state.abhaError ? `<p class="sub" style="color:var(--critical);margin-top:12px">${state.abhaError}</p>` : ''}
    <div class="grid" style="margin-top:20px">
      <button class="opt" onclick="skipAbha()">
        <span class="ico">🚶</span>
        <span class="txt"><strong>${t('abhaNone')}</strong></span>
      </button>
    </div>`;
  renderControls([{ label: t('abhaCheck'), cls: 'primary', onClick: checkAbha }]);
  const box = $('abhainput');
  if (box) {
    box.oninput = () => { state.abhaInput = box.value; };
    box.onkeydown = (e) => { if (e.key === 'Enter') checkAbha(); };
    box.focus();
  }
  speak(t('abhaTitle'));
}

async function checkAbha() {
  const value = (($('abhainput') || {}).value || '').trim();
  if (!value) return;
  state.abhaInput = value;
  state.abhaError = null;
  try {
    const data = await api('/api/abha/resolve?q=' + encodeURIComponent(value));
    if (!data.ok) { state.abhaError = t('abhaBad'); render(); return; }
    state.abhaResolved = data.abha;
    render();
  } catch (err) {
    state.abhaError = t('abhaBad');
    render();
  }
}

function skipAbha() { createSession(null); }

function renderConsent() {
  setProgress(0.05);
  const points = state.lang === 'hi'
    ? ['आपके जवाब डॉक्टर को दिखाए जाएंगे।',
       'आपकी रिपोर्ट आपके ABHA रिकॉर्ड से जुड़ेगी।',
       'जाँच पूरी होते ही यहाँ का अस्थायी डेटा मिटा दिया जाएगा।',
       'आप कभी भी मना कर सकते हैं।']
    : ['Your answers will be shown to the doctor.',
       'Your record will be linked to your ABHA account.',
       'Temporary data here is erased as soon as it is submitted.',
       'You may refuse at any time.'];
  screen().innerHTML = `
    <h1>${t('consentTitle')}</h1>
    <p class="sub">${state.lang === 'hi' ? 'आगे बढ़ने से पहले कृपया सुनिए।' : 'Please read or listen before continuing.'}</p>
    <div class="card"><ul class="plain">${points.map((p) => `<li>${p}</li>`).join('')}</ul></div>
    <p class="sub" style="font-size:16px">DPDP Act 2023 · ABDM consent framework</p>`;
  renderControls([
    { label: '🔊 ' + (state.lang === 'hi' ? 'दोबारा सुनें' : 'Read aloud'), onClick: () => speak(points.join('. ')) },
    { label: state.lang === 'hi' ? 'मैं सहमत हूँ' : 'I agree', cls: 'primary', onClick: giveConsent }
  ]);
  speak(points.join('. '));
}

async function giveConsent() {
  await api(`/api/intake/${state.sessionId}/consent`, 'POST', { scopes: ['capture', 'share-with-his', 'link-abha'] });
  stage = 'question';
  await loadNext();
}

async function loadNext() {
  const data = await api(`/api/intake/${state.sessionId}/next`);
  applyStep(data);
}

function applyStep(data) {
  if (data.progress) setProgress(data.progress.total ? data.progress.answered / data.progress.total : 0);
  if (!data.question) { stage = 'documents'; render(); return; }
  state.question = data.question;
  state.selection = [];
  renderQuestion();
}

function renderQuestion() {
  const q = state.question;
  if (!q) return;
  const prompt = L(q.prompt);
  const help = q.help ? L(q.help) : t('tapOrSpeak');

  let bodyHtml = '';
  if (q.type === 'scale') {
    const scale = q.scale || { min: 1, max: 10 };
    let buttons = '';
    for (let n = scale.min; n <= scale.max; n++) {
      buttons += `<button onclick="choose(${n})" aria-pressed="false" id="opt-${n}">${n}</button>`;
    }
    bodyHtml = `<div class="scale">${buttons}</div>
      <div class="scale-ends"><span>${L(scale.minLabel)}</span><span>${L(scale.maxLabel)}</span></div>`;
  } else if (q.type === 'text') {
    bodyHtml = `<textarea id="freetext" placeholder="${state.lang === 'hi' ? 'यहाँ लिखिए या बोलिए…' : 'Type or speak here…'}"></textarea>`;
  } else {
    bodyHtml = '<div class="grid">' + (q.options || []).map((o) => `
      <button class="opt" id="opt-${o.value}" aria-pressed="false" onclick="choose('${o.value}')">
        <span class="ico">${o.icon || '•'}</span>
        <span class="txt"><strong>${L(o.label)}</strong></span>
      </button>`).join('') + '</div>';
  }

  screen().innerHTML = `<h1>${prompt}</h1><p class="sub">${help}</p>${bodyHtml}<div class="heard" id="heard"></div>`;

  const multi = q.type === 'multi';
  renderControls([
    { label: t('speak'), cls: 'mic', id: 'mic', onClick: listen },
    multi || q.type === 'text'
      ? { label: t('next'), cls: 'primary', id: 'nextbtn', onClick: submitAnswer }
      : null
  ]);
  speak(prompt);
}

/** Records a tap or a matched utterance. Single-answer questions advance at once. */
function choose(value) {
  const q = state.question;
  if (!q) return;

  if (q.type === 'multi') {
    const index = state.selection.indexOf(value);
    if (index >= 0) state.selection.splice(index, 1); else state.selection.push(value);
    const btn = $('opt-' + value);
    if (btn) btn.setAttribute('aria-pressed', String(state.selection.includes(value)));
    return;
  }

  state.selection = [value];
  const btn = $('opt-' + value);
  if (btn) btn.setAttribute('aria-pressed', 'true');
  setTimeout(submitAnswer, 180);
}

async function submitAnswer() {
  const q = state.question;
  if (!q) return;
  let value;
  if (q.type === 'multi') value = state.selection;
  else if (q.type === 'text') value = ($('freetext') || {}).value || '';
  else value = state.selection[0];

  if (q.type === 'multi' && !value.length) return;
  if (value === undefined || value === '') return;

  const data = await api(`/api/intake/${state.sessionId}/answer`, 'POST', { questionId: q.id, value });

  // A CRITICAL red flag interrupts the interview immediately rather than waiting
  // for the patient to finish answering everything.
  if (data.escalate && data.redFlags && data.redFlags.length) {
    showAlert(data.redFlags[0]);
    return;
  }
  applyStep(data);
}

function showAlert(flag) {
  $('alert-title').textContent = state.lang === 'hi' ? 'कृपया रुकिए' : 'Please wait here';
  $('alert-body').textContent = L(flag.concern);
  $('alert-action').textContent = state.lang === 'hi'
    ? 'स्टाफ को सूचित कर दिया गया है। आपको पहले देखा जाएगा।'
    : 'Staff have been alerted. You will be seen first.';
  $('alert-btn').textContent = state.lang === 'hi' ? 'ठीक है, आगे बढ़ें' : 'OK, continue';
  $('alert').classList.remove('hide');
  speak(state.lang === 'hi'
    ? 'कृपया यहीं रुकिए। स्टाफ को सूचित कर दिया गया है।'
    : 'Please wait here. Staff have been alerted.');
}

function dismissAlert() {
  $('alert').classList.add('hide');
  loadNext();
}

/* ---------- documents ---------------------------------------------------- */

function renderDocuments() {
  setProgress(0.9);
  screen().innerHTML = `
    <h1>${t('scanTitle')}</h1>
    <p class="sub">${state.lang === 'hi'
      ? 'पुरानी रिपोर्ट या पर्चा हो तो उसकी फोटो लीजिए। डॉक्टर को पहले ही दिख जाएगा।'
      : 'Photograph any previous report or prescription so the doctor sees it in advance.'}</p>
    <input type="file" id="docfile" accept="image/*" capture="environment" class="hide" onchange="handleFile(event)">
    <div class="card" id="doclist">${state.documents.length ? '' :
      `<p class="sub" style="margin:0">${state.lang === 'hi' ? 'अभी कोई रिपोर्ट नहीं जोड़ी गई।' : 'No reports added yet.'}</p>`}</div>`;
  refreshDocList();
  renderControls([
    { label: t('scanAdd'), onClick: () => $('docfile').click() },
    { label: state.documents.length ? t('finish') : t('scanSkip'), cls: 'primary', id: 'finishbtn', onClick: finalize }
  ]);
  speak(state.lang === 'hi'
    ? 'अगर आपके पास पुरानी रिपोर्ट है तो उसकी फोटो लीजिए, वरना जमा करें दबाइए।'
    : 'Photograph any previous report, or press submit.');
}

function refreshDocList() {
  const list = $('doclist');
  if (!list) return;
  if (!state.documents.length) return;
  list.innerHTML = state.documents.map((d) => `
    <div class="docrow">
      <span>📄</span>
      <span style="flex:1">${d.name}
        ${d.results && d.results.length ? `<br><small style="color:var(--muted)">${d.results.length} values read</small>` : ''}</span>
      ${(d.results || []).some((r) => r.abnormal) ? '<span class="tag warn">abnormal</span>' : '<span class="tag">added</span>'}
    </div>`).join('');
}

/**
 * OCR runs in the browser so the image itself never leaves the kiosk — only the
 * extracted text is posted for structuring. If Tesseract cannot load (offline
 * kiosk, blocked CDN), the document is still recorded so the physician knows it
 * exists and can look at the paper the patient is carrying.
 */
async function handleFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const name = file.name || 'Scanned report';
  const btn = $('finishbtn');
  if (btn) { btn.disabled = true; btn.textContent = t('processing'); }

  let text = '';
  try {
    if (!window.Tesseract) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
    const result = await window.Tesseract.recognize(file, 'eng');
    text = (result && result.data && result.data.text) || '';
  } catch (err) {
    console.warn('OCR unavailable:', err);
  }

  try {
    const saved = await api(`/api/intake/${state.sessionId}/document`, 'POST', { name, kind: 'report', text });
    state.documents.push(saved.document);
  } catch (err) {
    state.documents.push({ name, results: [] });
  }

  if (btn) { btn.disabled = false; }
  renderDocuments();
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}

/* ---------- finish ------------------------------------------------------- */

let result = null;

async function finalize() {
  if (state.finalizing) return;
  state.finalizing = true;
  const btn = $('finishbtn');
  if (btn) { btn.disabled = true; btn.textContent = t('processing'); }
  try {
    result = await api(`/api/intake/${state.sessionId}/finalize`, 'POST', {});
    stage = 'done';
    render();
  } catch (err) {
    state.finalizing = false;
    if (btn) { btn.disabled = false; btn.textContent = t('finish'); }
  }
}

function renderDone() {
  setProgress(1);
  const token = (result && result.worklistId || '').slice(0, 4).toUpperCase();
  const critical = result && result.priority === 'CRITICAL';
  screen().innerHTML = `
    <h1>${t('doneTitle')} ✅</h1>
    <p class="sub">${state.lang === 'hi'
      ? 'आपकी जानकारी डॉक्टर की स्क्रीन पर पहुँच गई है।'
      : 'Your history has reached the doctor’s screen.'}</p>
    <div class="card" style="text-align:center">
      <p class="sub" style="margin:0 0 6px">${state.lang === 'hi' ? 'आपका टोकन' : 'Your token'}</p>
      <div style="font-size:64px;font-weight:700;letter-spacing:.06em">${token}</div>
      ${critical ? `<p style="color:var(--critical);font-weight:600;font-size:20px">
        ${state.lang === 'hi' ? 'आपको प्राथमिकता दी गई है — यहीं प्रतीक्षा करें।' : 'You have been prioritised — please wait here.'}</p>` : ''}
    </div>
    <p class="sub" style="font-size:16px">${state.lang === 'hi'
      ? 'यहाँ का अस्थायी डेटा मिटा दिया गया है।'
      : 'Temporary data on this kiosk has been erased.'}</p>`;
  renderControls([{ label: state.lang === 'hi' ? 'नया मरीज़' : 'New patient', cls: 'primary', onClick: () => location.reload() }]);
  speak(state.lang === 'hi'
    ? `आपका टोकन ${token.split('').join(' ')} है। ${critical ? 'कृपया यहीं प्रतीक्षा करें, आपको पहले देखा जाएगा।' : 'कृपया प्रतीक्षा करें।'}`
    : `Your token is ${token.split('').join(' ')}. Please wait.`);
}

/* ---------- boot --------------------------------------------------------- */

(async function boot() {
  try { state.config = await api('/api/intake/config'); } catch (err) { /* render without the stats line */ }
  render();
})();
</script>
</body>
</html>
